<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Quimicraft</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg form-page">

    <a href="login.html" class="btn-voltar" aria-label="Voltar">←</a>

    <div class="container center">
        <h1 class="brand-logo">QUIMI<span class="logo-soft">CRAFT</span></h1>
        <div class="card">
            <h1 class="titulo-card">REDEFINIR SENHA</h1>

            <form action="../php/redefinir_senha.php" method="POST">
                <label class="field-label" for="nome">NOME DE USUÁRIO</label>
                <input id="nome" type="text" name="nome" placeholder="Seu nome de usuário" class="input" required>

                <label class="field-label" for="turma">TURMA</label>
                <select id="turma" name="turma" class="custom-select-native" required>
                    <option value="">Selecione a turma</option>
                    <optgroup label="INFO">
                        <option value="1">1 INFO A</option>
                        <option value="2">1 INFO B</option>
                        <option value="3">2 INFO A</option>
                        <option value="4">2 INFO B</option>
                        <option value="5">3 INFO A</option>
                        <option value="6">3 INFO B</option>
                    </optgroup>
                    <optgroup label="AGRO">
                        <option value="7">1 A</option>
                        <option value="8">1 B</option>
                        <option value="9">1 C</option>
                        <option value="10">1 E</option>
                        <option value="11">2 A</option>
                        <option value="12">2 B</option>
                        <option value="13">2 C</option>
                        <option value="14">2 E</option>
                        <option value="15">3 A</option>
                        <option value="16">3 B</option>
                        <option value="17">3 C</option>
                        <option value="18">3 E</option>
                    </optgroup>
                </select>

                <label class="field-label" for="senha">NOVA SENHA</label>
                <input id="senha" type="password" name="senha" placeholder="Nova senha" class="input" required>

                <label class="field-label" for="confirmar">CONFIRMAR SENHA</label>
                <input id="confirmar" type="password" name="confirmar" placeholder="Repita a nova senha" class="input" required>

                <div class="btn-container">
                    <button type="submit" class="btn">REDEFINIR</button>
                </div>

                <p class="texto-aux">
                    Lembrou a senha?
                    <a href="login.html">Fazer login</a>
                </p>
            </form>
        </div>
    </div>

    <script src="../js/custom-select.js"></script>
    <script src="../js/alerta.js"></script>
</body>
</html>
