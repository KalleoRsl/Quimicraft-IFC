<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg form-page">

    <a href="index.html" class="btn-voltar">←</a>

    <div class="container center">

        <div class="card">

            <h1 class="titulo-card">CADASTRO</h1>

            <form action="../php/cadastrar.php" method="POST">

                <input type="text" name="nome" placeholder="INSIRA SEU NOME DE USUÁRIO..." class="input">

                <input type="password" name="senha" placeholder="INSIRA SUA SENHA..." class="input">

                <input type="password" name="confirmar" placeholder="CONFIRME SENHA..." class="input">

                <select name="turma" class="custom-select-native">
                    <option value="">SELECIONE A TURMA</option>
                    <optgroup label="INFO">
                        <option value="1">1 INFO A</option>
                        <option value="2">1 INFO B</option>
                        <option value="3">2 INFO A</option>
                        <option value="4">2 INFO B</option>
                        <option value="5">3 INFO A</option>
                        <option value="6">3 INFO B</option>
                    </optgroup>
                    <optgroup label="AGRO">
                        <option value="7">1 A</option>
                        <option value="8">1 B</option>
                        <option value="9">1 C</option>
                        <option value="10">1 E</option>
                        <option value="11">2 A</option>
                        <option value="12">2 B</option>
                        <option value="13">2 C</option>
                        <option value="14">2 E</option>
                        <option value="15">3 A</option>
                        <option value="16">3 B</option>
                        <option value="17">3 C</option>
                        <option value="18">3 E</option>
                    </optgroup>
                </select>

                <div class="btn-container">
                    <button type="submit" class="btn">CADASTRAR</button>
                </div>

            </form>

        </div>

    </div>

    <script src="../js/custom-select.js"></script>
    <script src="../js/alerta.js"></script>
</body>
</html>
